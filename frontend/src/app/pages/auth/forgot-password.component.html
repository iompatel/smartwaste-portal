<section class="auth-page single">
  <div class="left-panel" aria-labelledby="forgot-password-intro">
    <div class="hero-copy">
      <span class="eyebrow">Citizen Portal</span>
      <h1 id="forgot-password-intro">Forgot Password</h1>
      <p>Enter your registered email to request password reset.</p>
    </div>
  </div>

  <form
    class="auth-card"
    [formGroup]="form"
    (ngSubmit)="submit()"
    aria-labelledby="forgot-password-heading"
    aria-describedby="forgot-password-description"
  >
    <span class="eyebrow">Recovery Center</span>
    <h2 id="forgot-password-heading">Forgot Password</h2>
    <p id="forgot-password-description" class="muted">
      Enter your registered email to request password reset.
    </p>

    @if (message) {
      <p class="success" role="status" aria-live="polite">{{ message }}</p>
    }

    @if (error) {
      <p class="error" role="alert" aria-live="assertive">{{ error }}</p>
    }

    <label for="recovery-email">Email</label>
    <input id="recovery-email" type="email" formControlName="email" placeholder="name@example.com" />

    <button type="submit" class="primary" [disabled]="loading || cooldownSeconds > 0">
      @if (loading) {
        Sending...
      } @else if (cooldownSeconds > 0) {
        Wait {{ cooldownSeconds }}s
      } @else {
        Send Reset Link
      }
    </button>

    <div class="links">
      <a routerLink="/login">Back to login</a>
    </div>
  </form>
</section>

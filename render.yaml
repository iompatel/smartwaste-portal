services:
  - type: web
    name: smartwaste-backend
    env: node
    plan: free
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SERVICE_MODE
        value: public
      - key: MONGO_URI
        sync: false
      - key: WORKER_LOCATION_MONGO_URI
        # Optional: second free MongoDB cluster for live GPS pings. Leave unset to use MONGO_URI.
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: WORKER_FRONTEND_URL
        sync: false
      - key: SEED_DEMO_USERS
        value: "false"

  - type: web
    name: smartwaste-admin-backend
    env: node
    plan: free
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SERVICE_MODE
        value: admin
      - key: MONGO_URI
        sync: false
      - key: WORKER_LOCATION_MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: ADMIN_SESSION_TTL_MINUTES
        value: "30"
      - key: REQUIRE_CF_ACCESS
        # The reference deployment uses the Worker gate in cloudflare/admin-gate.
        value: "false"
      - key: ADMIN_EDGE_SECRET_HASH
        sync: false
      - key: CF_ACCESS_TEAM_DOMAIN
        sync: false
      - key: CF_ACCESS_AUD
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_USERS
        value: "false"

  - type: static
    name: smartwasteportal
    plan: free
    autoDeployTrigger: commit
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist/frontend/browser
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://smartwaste-backend-5zei.onrender.com https://*.googleapis.com https://apis.google.com https://accounts.google.com; frame-src https://smartwaste-98f9a.firebaseapp.com https://accounts.google.com https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(self)
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/runtime-config.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://smartwaste-backend-5zei.onrender.com/api

  - type: static
    name: smartwaste-worker
    plan: free
    rootDir: frontend
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:worker
    staticPublishPath: dist/worker/browser
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://smartwaste-backend-5zei.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self)
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/runtime-config.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://smartwaste-backend-5zei.onrender.com/api

  - type: static
    name: smartwaste-admin
    plan: free
    rootDir: frontend
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:admin
    staticPublishPath: dist/admin/browser
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/runtime-config.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://admin.smartwaste.dpdns.org/api

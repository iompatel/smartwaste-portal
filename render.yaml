services:
  - type: web
    name: smartwaste-backend
    env: node
    plan: free
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: static
    name: smartwaste-frontend
    plan: free
    rootDir: frontend
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/runtime-config.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /worker-console
        destination: /index.html
      - type: rewrite
        source: /admin-console
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://smartwaste-backend-5zei.onrender.com/api
